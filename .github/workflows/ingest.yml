name: ingest
# Manual trigger only. Scheduled captures run from Supabase pg_cron (see supabase/cron.example.sql):
# GitHub throttled this workflow's cron to one run every 3-5 hours, far too coarse for the history.
on:
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body -sS -X POST "${{ secrets.INGEST_URL }}" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" --max-time 90
